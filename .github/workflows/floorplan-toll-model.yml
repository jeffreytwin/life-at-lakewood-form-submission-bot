name: Floor Plan Slice — Toll model pages

# One-off discovery: capture Toll Brothers plan and quick move-in pages
# (their __NEXT_DATA__, pruned) from a runner with egress, and commit the
# dumps back so the extractor's per-plan enrichment can be written and
# unit-tested against real structure. Dispatch it on the working branch.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floorplan-toll-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Capture Toll Brothers model pages
        run: node pipeline/slice/discover-toll-model.mjs

      - name: Commit captures back to branch
        run: |
          git config user.name "floorplan-audit-bot"
          git config user.email "actions@github.com"
          git add pipeline/slice/discovery
          if git diff --cached --quiet; then
            echo "No capture changes to commit."
          else
            git commit -m "Floor plan slice: Toll Brothers model page captures [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

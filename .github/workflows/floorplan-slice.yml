name: Floor Plan Slice — Toll Brothers

on:
  workflow_dispatch:
  push:
    branches:
      - claude/wix-floor-plan-automation-sbqc80
    paths:
      - pipeline/audit/RUN_SLICE

permissions:
  contents: write

concurrency:
  group: floorplan-slice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Run slice script
        run: node pipeline/slice/fetch-toll.mjs

      - name: Commit results back to branch
        run: |
          git config user.name "floorplan-audit-bot"
          git config user.email "actions@github.com"
          git add pipeline/slice
          if git diff --cached --quiet; then
            echo "No slice changes to commit."
          else
            git commit -m "Floor plan slice: Toll Brothers discovery [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

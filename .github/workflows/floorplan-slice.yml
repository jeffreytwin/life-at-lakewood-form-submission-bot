name: Floor Plan Slice — Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - claude/wix-floor-plan-automation-sbqc80
      - claude/wix-floor-plan-automation-sbqc80-hyk0qe
    paths:
      - pipeline/audit/RUN_SLICE

permissions:
  contents: write

concurrency:
  group: floorplan-slice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Playwright Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run slice discovery
        run: node pipeline/slice/discover-round5-playwright.mjs

      - name: Commit results back to branch
        run: |
          git config user.name "floorplan-audit-bot"
          git config user.email "actions@github.com"
          git add pipeline/slice
          if git diff --cached --quiet; then
            echo "No slice changes to commit."
          else
            git commit -m "Floor plan slice: round-5 playwright discovery [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

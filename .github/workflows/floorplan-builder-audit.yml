name: Floor Plan Audit — Builder Sites

on:
  workflow_dispatch:
  push:
    branches:
      - claude/wix-floor-plan-automation-sbqc80
    paths:
      - pipeline/audit/RUN_BUILDERS

permissions:
  contents: write

concurrency:
  group: floorplan-builder-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Audit builder websites
        run: node pipeline/audit/audit-builders.mjs

      - name: Commit audit results back to branch
        run: |
          git config user.name "floorplan-audit-bot"
          git config user.email "actions@github.com"
          git add pipeline/audit/builder-audit
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "Floor plan audit: builder site signals [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
